<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil de Usuario - MyCard</title>
    <!-- Reutilizamos los estilos existentes para mantener el diseño -->
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="developer.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar (Mismo menú que en las otras páginas) -->
        <aside class="sidebar">
            <div class="logo">
                <div class="logo-icon">
                    <i class="fas fa-cube"></i>
                </div>
                <span class="logo-text">MyCard</span>
            </div>
            <nav class="nav-menu">
                <a href="dashboard.html" class="nav-item">
                    <i class="fas fa-home"></i>
                    <span>Dashboard</span>
                </a>
                <a href="shipments.html" class="nav-item">
                    <i class="fas fa-box"></i>
                    <span>Envíos</span>
                </a>
                <a href="analytics.html" class="nav-item">
                    <i class="fas fa-chart-bar"></i>
                    <span>Analíticas</span>
                </a>
                <a href="developer.html" class="nav-item">
                    <i class="fas fa-code"></i>
                    <span>Developer</span>
                </a>
            </nav>
        </aside>

        <!-- Contenido Principal -->
        <main class="main-content">
            <header class="top-header">
                <div class="header-left">
                    <h1 class="page-title">Perfil de Usuario</h1>
                </div>
                <div class="header-right">
                    <div class="user-profile">
                        <span>Fabrica MyCard</span>
                        <i class="fas fa-user-circle"></i>
                    </div>
                </div>
            </header>

            <div class="section-header">
                <h2 class="section-title">Información de Cuenta</h2>
            </div>

            <!-- Tarjeta de Perfil -->
            <div class="card" style="max-width: 800px; margin: 0 auto;">
                <div class="form-section">
                    <div class="form-group">
                        <label>Nombre de la Organización</label>
                        <input type="text" class="form-input" value="Fabrica MyCard" readonly>
                    </div>
                    <div class="form-group">
                        <label>ID de Usuario</label>
                        <input type="text" class="form-input" value="USR-2024-MYC-8821" readonly>
                    </div>
                    <div class="form-group">
                        <label>Correo Electrónico</label>
                        <input type="email" class="form-input" value="admin@mycard.com" readonly>
                    </div>
                    <div class="form-group">
                        <label>Tipo de Plan</label>
                        <input type="text" class="form-input" value="Enterprise - CrewdiVale" readonly style="color: var(--primary-color); font-weight: bold;">
                    </div>
                    
                    <div class="form-actions">
                        <button class="btn btn-primary">Guardar Cambios</button>
                        <button class="btn btn-outline">Cerrar Sesión</button>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
