<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso al Sistema de Rastreo</title> 
    <!-- Enlace a la hoja de estilos personalizada -->
    <link rel="stylesheet" href="diseño-login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
    <style>
        @import url('https://fonts.cdnfonts.com/css/line-seed-jp');
    </style>
</head>
<body>
    <!-- Encabezado superior: Icono y Título -->
    <div class="login-header">
        <div class="user-icon-wrapper">
            <i class="fas fa-user-circle user-icon-fa"></i>
        </div>
        <h2>INICIAR SESIÓN</h2>
        <p class="header-subtitle">Ingresa tus credenciales para acceder al sistema de rastreo.</p>
    </div>

        <div class="card" data-tilt data-tilt-max="5" data-tilt-glare data-tilt-max-glare="0.5">
            <div class="card-content">
                
                <!-- Sección del encabezado: Logo y Texto -->
                <div class="header-row">
                    <div class="brand">
                        <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgrsDN4CdYzmxGhcrZzhpNFYdGfFesb0M5nCSXPGYDGt3cLH3hMlRFPQVevdyTLNyglGqII6XySeAm8X1RwPyabrpnGBAmNxYX27rFbUVMPsfGZEQ4jYqY0c-64_wsm8Jh9pKJhRBTbYQDdfMfRQyD8Piqky_W2JHEPGxCRXcYcCE6YrBECAKJehJ0_/s1600/logo.png" class="brand-img">
                        <span>MyCard</span>
                    </div>
                </div>

                <!-- Formulario de Login -->
                <form class="login-form" id="login-form">
                    <div class="input-row">
                        <i class="fas fa-user input-icon"></i>
                        <label>Username :</label>
                        <input type="text" placeholder="REQUERIDO" required id="username-input">
                    </div>
                    <div class="input-row">
                        <i class="fas fa-lock input-icon"></i>
                        <label>Password:</label>
                        <input type="password" placeholder="••••••••" required id="password-input">
                        <i class="fas fa-eye password-toggle" id="toggle-password"></i>
                    </div>
                    <div id="login-error" style="color: red; font-size: 12px; margin-top: 10px; text-align: center; display: none;">Credenciales incorrectas</div>
                </form>

                <!-- Pie de tarjeta: Chip y Datos simulados -->
                <div class="footer-row">
                    <div class="chip-container">
                        <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhFzeQ0hz39haiHkhSOKnHJCG3v6AynORgBKrj0Zf2FTYMvjAsDAxzqIFZ8DYXbyq_-u_kuZcgg5nRpXxVGp18K15NiCGvVwTv-8QUGdZwJS3sSlhRpqEpZ3RHP7vQCIoKYnd6UFEAzxrhFPR5byjFFR6ld7gWvNCD7g5LF3Y6uhJvgY1_hw8qBCqO6/s1600/chip.png" class="chip-img">
                    </div>
                    <!-- Botón de autorización movido al pie -->
                    <button class="button2" type="submit" form="login-form">Acceder</button>
                </div>
            </div>
        </div>


    <!-- Librería para el efecto de inclinación (Tilt) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.7.0/vanilla-tilt.min.js"></script>

    <!-- Script para mostrar/ocultar contraseña y Auth Logic -->
    <script>
        const togglePassword = document.querySelector('#toggle-password');
        const password = document.querySelector('#password-input');
        const loginForm = document.getElementById('login-form');
        const usernameInput = document.getElementById('username-input');
        const passwordInput = document.getElementById('password-input');
        const errorMsg = document.getElementById('login-error');

        togglePassword.addEventListener('click', function () {
            // Alternar el tipo de input entre password y text
            const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
            password.setAttribute('type', type);
            // Alternar el icono (ojo abierto / ojo tachado)
            this.classList.toggle('fa-eye');
            this.classList.toggle('fa-eye-slash');
        });

        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const user = usernameInput.value.trim();
            const pass = passwordInput.value.trim();
            
            if (user === 'admin_plata' && pass === 'plata123') {
                localStorage.setItem('currentUser', 'plata');
                window.location.href = 'dashboard.html';
            } else if (user === 'admin_broxel' && pass === 'broxel123') {
                localStorage.setItem('currentUser', 'broxel');
                window.location.href = 'dashboard.html';
            } else {
                // Fallback para pruebas rápidas si no coinciden
                // Si el usuario pone cualquier otra cosa, por seguridad mejor mostrar error, 
                // pero si quieres mantener el comportamiento anterior de entrar directo:
                // localStorage.setItem('currentUser', 'plata'); // Default
                // window.location.href = 'dashboard.html';
                
                // Mejor mostramos error para que prueben los usuarios reales
                errorMsg.style.display = 'block';
                
                // Shake effect visual
                const card = document.querySelector('.card');
                card.style.animation = 'shake 0.5s';
                setTimeout(() => card.style.animation = '', 500);
            }
        });
    </script>
    <style>
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }
            75% { transform: translateX(-10px); }
            100% { transform: translateX(0); }
        }
    </style>
</body>
</html>
