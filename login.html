<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso al Sistema de Rastreo</title> 
    <!-- Enlace a la hoja de estilos personalizada -->
    <link rel="stylesheet" href="diseño-login.css">
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Arimo:ital,wght@0,400..700;1,400..700&family=Caveat:wght@400..700&family=IBM+Plex+Sans:ital,wght@0,100..700;1,100..700&family=Pacifico&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Fondo animado de ondas -->
    <div class="circle xxlarge shade1"></div>
    <div class="circle xlarge shade2"></div>
    <div class="circle large shade3"></div>
    <div class="circle medium shade4"></div>
    <div class="circle small shade5"></div>

    <div class="glass-bg">
        
        <!-- Encabezado superior: Icono y Título -->
        <div class="login-header">
            <img src="img/usuario.png" alt="Usuario" class="user-icon-top" width="80" height="80">
            <h2>INICIAR SESIÓN</h2>
            <p class="header-subtitle">Ingresa tus credenciales para acceder al sistema de rastreo.</p>
            
        </div>

        <div class="card" data-tilt data-tilt-max="5" data-tilt-glare data-tilt-max-glare="0.5">
            <div class="card-content">
                
                <!-- Sección del encabezado: Logo y Texto -->
                <div class="header-row">
                    <div class="brand">
                        <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgrsDN4CdYzmxGhcrZzhpNFYdGfFesb0M5nCSXPGYDGt3cLH3hMlRFPQVevdyTLNyglGqII6XySeAm8X1RwPyabrpnGBAmNxYX27rFbUVMPsfGZEQ4jYqY0c-64_wsm8Jh9pKJhRBTbYQDdfMfRQyD8Piqky_W2JHEPGxCRXcYcCE6YrBECAKJehJ0_/s1600/logo.png" class="brand-img" width="50" height="50">
                        <span>MyCard</span>
                    </div>
                </div>

                <!-- Formulario de Login -->
                <form class="login-form" id="login-form">
                    <div class="input-row">
                        <img src="https://img.icons8.com/ios-glyphs/30/000000/user--v1.png" class="input-icon" width="16" height="16">
                        <label>Username :</label>
                        <input type="text" placeholder="REQUERIDO" required id="username-input">
                    </div>
                    <div class="input-row">
                        <img src="https://img.icons8.com/ios-glyphs/30/000000/lock--v1.png" class="input-icon" width="16" height="16">
                        <label>Password:</label>
                        <input type="password" placeholder="••••••••" required id="password-input">
                        <img src="https://img.icons8.com/ios-glyphs/30/000000/visible--v1.png" class="password-toggle" id="toggle-password" width="20" height="20">
                    </div>
                    <div id="login-error" class="login-error">Credenciales incorrectas</div>
                </form>

                <!-- Pie de tarjeta: Chip  -->
                <div class="footer-row">
                    <div class="chip-container">
                        <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhFzeQ0hz39haiHkhSOKnHJCG3v6AynORgBKrj0Zf2FTYMvjAsDAxzqIFZ8DYXbyq_-u_kuZcgg5nRpXxVGp18K15NiCGvVwTv-8QUGdZwJS3sSlhRpqEpZ3RHP7vQCIoKYnd6UFEAzxrhFPR5byjFFR6ld7gWvNCD7g5LF3Y6uhJvgY1_hw8qBCqO6/s1600/chip.png" class="chip-img" width="50" height="40">
                    </div>
                    <!-- Botón de autorización movido al pie -->
                    <button class="button2" type="submit" form="login-form">Acceder</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Librería para el efecto de inclinación (Tilt) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.7.0/vanilla-tilt.min.js"></script>

    <!-- Script para mostrar/ocultar contraseña y Auth Logic -->
    <script>
        const togglePassword = document.querySelector('#toggle-password');
        const password = document.querySelector('#password-input');
        const loginForm = document.getElementById('login-form');
        const usernameInput = document.getElementById('username-input');
        const passwordInput = document.getElementById('password-input');
        const errorMsg = document.getElementById('login-error');

        togglePassword.addEventListener('click', function () {
            // Alternar el tipo de input entre password y text
            const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
            password.setAttribute('type', type);
            // Alternar el icono (ojo abierto / ojo tachado)
            this.src = type === 'password' ? 'https://img.icons8.com/ios-glyphs/30/000000/visible--v1.png' : 'https://img.icons8.com/ios-glyphs/30/000000/invisible--v1.png';
        });

        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const user = usernameInput.value.trim();
            const pass = passwordInput.value.trim();
            
            if (user === 'admin_plata' && pass === 'plata123') {
                localStorage.setItem('currentUser', 'plata');
                window.location.href = 'dashboard.html';
            } else if (user === 'admin_broxel' && pass === 'broxel123') {
                localStorage.setItem('currentUser', 'broxel');
                window.location.href = 'dashboard.html';
            } else {
                // Fallback para pruebas rápidas si no coinciden
                // Si el usuario pone cualquier otra cosa, por seguridad mejor mostrar error, 
                // pero si quieres mantener el comportamiento anterior de entrar directo:
                // localStorage.setItem('currentUser', 'plata'); // Default
                // window.location.href = 'dashboard.html';
                
                // Mejor mostramos error para que prueben los usuarios reales
                errorMsg.style.display = 'block';
                
                // Shake effect visual
                const card = document.querySelector('.card');
                card.style.animation = 'shake 0.5s';
                setTimeout(() => card.style.animation = '', 500);
            }
        });
    </script>
</body>
</html>
