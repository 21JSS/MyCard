<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso al Sistema de Rastreo</title> 
    <!-- Enlace a la hoja de estilos personalizada -->
    <link rel="stylesheet" href="diseño-login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
    <style>
        @import url('https://fonts.cdnfonts.com/css/line-seed-jp');
    </style>
</head>
<body>
        <div class="card" data-tilt data-tilt-max="5" data-tilt-glare data-tilt-max-glare="0.5">
            <div class="card-content">
                
                <!-- Sección del encabezado: Logo y Texto -->
                <div class="header-row">
                    <div class="brand">
                        <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgrsDN4CdYzmxGhcrZzhpNFYdGfFesb0M5nCSXPGYDGt3cLH3hMlRFPQVevdyTLNyglGqII6XySeAm8X1RwPyabrpnGBAmNxYX27rFbUVMPsfGZEQ4jYqY0c-64_wsm8Jh9pKJhRBTbYQDdfMfRQyD8Piqky_W2JHEPGxCRXcYcCE6YrBECAKJehJ0_/s1600/logo.png" class="brand-img">
                        <span>MyCard</span>
                    </div>
                </div>

                <!-- Formulario de Login -->
                <form class="login-form" id="login-form">
                    <!-- Input de Username -->
                    <div class="nebula-input">
                        <i class="fas fa-user input-icon-left"></i>
                        <input required="" type="text" name="username" autocomplete="off" class="input" id="username-input" />
                        <label class="user-label">Username</label>
                        <div class="nebula-particle" style="--x:0.2; --y:-0.4; --delay:0.1s"></div>
                        <div class="nebula-particle" style="--x:0.5; --y:-0.2; --delay:0.3s"></div>
                        <div class="nebula-particle" style="--x:0.3; --y:0.3; --delay:0.5s"></div>
                        <div class="nebula-particle" style="--x:0.7; --y:0.1; --delay:0.2s"></div>
                        <div class="nebula-particle" style="--x:0.1; --y:-0.7; --delay:0.4s"></div>
                        <div class="nebula-particle" style="--x:0.6; --y:0.4; --delay:0.6s"></div>
                    </div>

                    <!-- Input de Password -->
                    <div class="nebula-input password-container">
                        <i class="fas fa-lock input-icon-left"></i>
                        <input required="" type="password" name="password" autocomplete="off" class="input" id="password-input" />
                        <label class="user-label">Password</label>
                        <i class="fas fa-eye password-toggle" id="toggle-password"></i>
                        <div class="nebula-particle" style="--x:0.2; --y:-0.4; --delay:0.1s"></div>
                        <div class="nebula-particle" style="--x:0.5; --y:-0.2; --delay:0.3s"></div>
                        <div class="nebula-particle" style="--x:0.3; --y:0.3; --delay:0.5s"></div>
                        <div class="nebula-particle" style="--x:0.7; --y:0.1; --delay:0.2s"></div>
                        <div class="nebula-particle" style="--x:0.1; --y:-0.7; --delay:0.4s"></div>
                        <div class="nebula-particle" style="--x:0.6; --y:0.4; --delay:0.6s"></div>
                    </div>

                    <div id="login-error" class="login-error">Credenciales incorrectas</div>
                </form>

                <!-- Pie de tarjeta: Chip y Botón -->
                <div class="chip-container">
                    <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhFzeQ0hz39haiHkhSOKnHJCG3v6AynORgBKrj0Zf2FTYMvjAsDAxzqIFZ8DYXbyq_-u_kuZcgg5nRpXxVGp18K15NiCGvVwTv-8QUGdZwJS3sSlhRpqEpZ3RHP7vQCIoKYnd6UFEAzxrhFPR5byjFFR6ld7gWvNCD7g5LF3Y6uhJvgY1_hw8qBCqO6/s1600/chip.png" class="chip-img">
                </div>
                <!-- Botón de autorización -->
                <button class="button" type="submit" form="login-form" id="login-button">
                    <span>Acceder</span>
                </button>
            </div>
        </div>

    <!-- Loading Overlay (Pantalla Completa) -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner">
            <svg
                class="pl"
                width="128px"
                height="128px"
                viewBox="0 0 128 128"
                xmlns="http://www.w3.org/2000/svg"
            >
                <circle
                    class="pl__ring2"
                    cx="64"
                    cy="64"
                    r="52.5"
                    fill="none"
                    stroke="#676EF4"
                    stroke-width="12"
                    transform="rotate(-90,64,64)"
                    stroke-linecap="round"
                    stroke-dasharray="329.9 329.9"
                    stroke-dashoffset="-329.3"
                ></circle>

                <circle
                    class="pl__ring4"
                    cx="64"
                    cy="64"
                    r="37.5"
                    fill="none"
                    stroke="#121DED"
                    stroke-width="9"
                    transform="rotate(-90,64,64)"
                    stroke-linecap="round"
                    stroke-dasharray="254.5 254.5"
                    stroke-dashoffset="-254"
                ></circle>

                <circle
                    class="pl__ring6"
                    cx="64"
                    cy="64"
                    r="22.5"
                    fill="none"
                    stroke="#464FF1"
                    stroke-width="9"
                    transform="rotate(-90,64,64)"
                    stroke-linecap="round"
                    stroke-dasharray="204.2 204.2"
                    stroke-dashoffset="-203.9"
                ></circle>
            </svg>
            <div class="loading-text">AUTENTICANDO...</div>
        </div>
    </div>

    <!-- Librería para el efecto de inclinación (Tilt) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.7.0/vanilla-tilt.min.js"></script>

    <!-- Script para mostrar/ocultar contraseña y Auth Logic -->
    <script>
        const togglePassword = document.querySelector('#toggle-password');
        const password = document.querySelector('#password-input');
        const loginForm = document.getElementById('login-form');
        const usernameInput = document.getElementById('username-input');
        const passwordInput = document.getElementById('password-input');
        const errorMsg = document.getElementById('login-error');
        const loadingOverlay = document.getElementById('loadingOverlay');

        togglePassword.addEventListener('click', function () {
            // Alternar el tipo de input entre password y text
            const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
            password.setAttribute('type', type);
            // Alternar el icono (ojo abierto / ojo tachado)
            this.classList.toggle('fa-eye');
            this.classList.toggle('fa-eye-slash');
        });

        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Mostrar overlay de carga
            loadingOverlay.classList.add('active');
            errorMsg.style.display = 'none';
            
            const user = usernameInput.value.trim();
            const pass = passwordInput.value.trim();
            
            // Simular delay de autenticación (1.5 segundos)
            setTimeout(() => {
                if (user === 'admin_plata' && pass === 'plata123') {
                    localStorage.setItem('currentUser', 'plata');
                    window.location.href = 'dashboard.html';
                } else if (user === 'admin_broxel' && pass === 'broxel123') {
                    localStorage.setItem('currentUser', 'broxel');
                    window.location.href = 'dashboard.html';
                } else {
                    // Ocultar overlay
                    loadingOverlay.classList.remove('active');
                    
                    // Mostrar error
                    errorMsg.style.display = 'block';
                    
                    // Shake effect visual
                    const card = document.querySelector('.card');
                    card.style.animation = 'shake 0.5s';
                    setTimeout(() => card.style.animation = '', 500);
                }
            }, 1500);
        });
    </script>
</body>
</html>
